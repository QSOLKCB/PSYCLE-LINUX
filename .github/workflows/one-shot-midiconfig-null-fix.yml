name: One-shot MIDI config null repair

on:
  push:
    branches:
      - phase-4/render-bounce-sampler

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4/render-bounce-sampler
          fetch-depth: 0

      - name: Make optional MIDI configuration null-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('cpsycle/audio/src/midiconfig.c')
          text = path.read_text()

          old = '''\tpsy_configuration_connect(cfg, "macselect",
          \t\tself, psy_audio_midiconfig_on_mac_select);
          \tpsy_configuration_connect(cfg, "auxselect",
          \t\tself, psy_audio_midiconfig_on_aux_select);
          \tpsy_configuration_connect(cfg, "recordrawmidiasmcm",
          \t\tself, psy_audio_midiconfig_on_record_raw_midi_as_mcm);
          \tpsy_configuration_connect(cfg, "addcontroller",\t
          \t\tself, psy_audio_midiconfig_on_add_controller);
          \tpsy_configuration_connect(cfg, "removecontrollers",\t
          \t\tself, psy_audio_midiconfig_on_remove_controller);\t
          '''
          new = '''\tif (cfg) {
          \t\tpsy_configuration_connect(cfg, "macselect",
          \t\t\tself, psy_audio_midiconfig_on_mac_select);
          \t\tpsy_configuration_connect(cfg, "auxselect",
          \t\t\tself, psy_audio_midiconfig_on_aux_select);
          \t\tpsy_configuration_connect(cfg, "recordrawmidiasmcm",
          \t\t\tself, psy_audio_midiconfig_on_record_raw_midi_as_mcm);
          \t\tpsy_configuration_connect(cfg, "addcontroller",\t
          \t\t\tself, psy_audio_midiconfig_on_add_controller);
          \t\tpsy_configuration_connect(cfg, "removecontrollers",\t
          \t\t\tself, psy_audio_midiconfig_on_remove_controller);\t
          \t}
          '''
          if old not in text:
              raise SystemExit('init connect block not found')
          text = text.replace(old, new, 1)

          old = '''\tassert(self);

          \tgroups = psy_configuration_at(self->cfg, "groups");
          '''
          new = '''\tassert(self);

          \tif (!self->cfg) {
          \t\treturn;
          \t}
          \tgroups = psy_configuration_at(self->cfg, "groups");
          '''
          if old not in text:
              raise SystemExit('controller config lookup block not found')
          text = text.replace(old, new, 1)

          old = '''\tassert(self);

          \tp = psy_configuration_at(self->cfg, "controllerdata");
          '''
          new = '''\tassert(self);

          \tif (!self->cfg) {
          \t\treturn;
          \t}
          \tp = psy_configuration_at(self->cfg, "controllerdata");
          '''
          if old not in text:
              raise SystemExit('controller write block not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit repair and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-midiconfig-null-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cpsycle/audio/src/midiconfig.c .github/workflows/one-shot-midiconfig-null-fix.yml
          git commit -m "fix: allow player without MIDI configuration"
          git push origin HEAD:phase-4/render-bounce-sampler
