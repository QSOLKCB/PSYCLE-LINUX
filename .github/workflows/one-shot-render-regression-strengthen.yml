name: One-shot render regression strengthen

on:
  push:
    branches:
      - phase-4/render-bounce-sampler

permissions:
  contents: write

jobs:
  strengthen:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4/render-bounce-sampler
          fetch-depth: 0

      - name: Strengthen render and PCM assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/phase4_render_bounce_sampler.c')
          text = path.read_text()

          old = '''#define MIN_RENDER_PEAK 100.0
          #define PCM_COMPARE_FRAMES 512u
          #define PCM_TOLERANCE 0.5
          '''
          new = '''#define MIN_RENDER_PEAK 100.0
          #define FILEOUT_BLOCK_FRAMES 1024u
          #define PCM_TOLERANCE 0.5
          '''
          if old not in text:
              raise SystemExit('constant block not found')
          text = text.replace(old, new, 1)

          old = '''\tinfo->frames = info->data_bytes / frame_bytes;
          \tif (info->frames == 0u) {
          \t\tfclose(file);
          \t\treturn fail("rendered WAV contains no audio frames");
          \t}
          \tif (fseek(file, 44, SEEK_SET) != 0) {
          '''
          new = '''\tinfo->frames = info->data_bytes / frame_bytes;
          \tif (info->frames == 0u) {
          \t\tfclose(file);
          \t\treturn fail("rendered WAV contains no audio frames");
          \t}
          \t/* FileOut renders fixed 1,024-frame blocks. The deterministic source
          \t** is 11,025 frames, so only the final block may extend the file. */
          \tif (info->frames < SOURCE_FRAMES ||
          \t\t\tinfo->frames >= SOURCE_FRAMES + FILEOUT_BLOCK_FRAMES) {
          \t\tfclose(file);
          \t\treturn fail("rendered WAV duration falls outside the final-buffer tolerance");
          \t}
          \tif (fseek(file, 44, SEEK_SET) != 0) {
          '''
          if old not in text:
              raise SystemExit('duration insertion point not found')
          text = text.replace(old, new, 1)

          marker = '''static int compare_bounced_pcm(psy_audio_Song* before, psy_audio_Song* after)
          '''
          if marker not in text:
              raise SystemExit('compare function marker not found')
          helper = r'''static int compare_imported_pcm_with_wav(psy_audio_Song* song,
          	const char* path, const WavInfo* info)
          {
          	psy_audio_Sample* sample;
          	FILE* file;
          	uintptr_t frame;
          	uintptr_t channel;

          	sample = psy_audio_samples_at(psy_audio_song_samples(song),
          		psy_audio_sampleindex_make(0, 0));
          	if (!sample || sample->channels.numchannels != info->channels ||
          			psy_audio_sample_num_frames(sample) != info->frames) {
          		return fail("cannot compare rendered WAV with imported Sampler PCM");
          	}
          	file = fopen(path, "rb");
          	if (!file) {
          		return fail("could not reopen rendered WAV for PCM comparison");
          	}
          	if (fseek(file, 44, SEEK_SET) != 0) {
          		fclose(file);
          		return fail("could not seek to rendered WAV PCM for comparison");
          	}
          	for (frame = 0; frame < info->frames; ++frame) {
          		for (channel = 0; channel < info->channels; ++channel) {
          			unsigned char bytes[2];
          			int16_t expected;
          			double actual;

          			if (fread(bytes, 1, 2, file) != 2) {
          				fclose(file);
          				return fail("rendered WAV ended during Sampler PCM comparison");
          			}
          			expected = (int16_t)read_u16_le(bytes);
          			actual = (double)sample->channels.samples[channel][frame];
          			if (fabs(actual - (double)expected) > PCM_TOLERANCE) {
          				fprintf(stderr,
          					"phase4-render-bounce-sampler: FAIL: WAV/Sampler PCM mismatch at frame %lu channel %lu: expected %d, got %.3f\n",
          					(unsigned long)frame, (unsigned long)channel,
          					(int)expected, actual);
          				fclose(file);
          				return 1;
          			}
          		}
          	}
          	fclose(file);
          	return 0;
          }

          '''
          text = text.replace(marker, helper + marker, 1)

          old = '''\tchannels = lhs->channels.numchannels;
          \tframes = psy_audio_sample_num_frames(lhs);
          \tif (frames > PCM_COMPARE_FRAMES) {
          \t\tframes = PCM_COMPARE_FRAMES;
          \t}
          \tfor (channel = 0; channel < channels; ++channel) {
          '''
          new = '''\tchannels = lhs->channels.numchannels;
          \tframes = psy_audio_sample_num_frames(lhs);
          \tfor (channel = 0; channel < channels; ++channel) {
          '''
          if old not in text:
              raise SystemExit('PCM cap block not found')
          text = text.replace(old, new, 1)

          old = '''\t\t} else {
          \t\t\tpsy_audio_machinecallback_set_song(&import_callback, bounced_song);
          \t\t\trc = verify_bounced_song(bounced_song, &wav_info);
          \t\t}
          \t}
          \tif (rc == 0) {
          '''
          new = '''\t\t} else {
          \t\t\tpsy_audio_machinecallback_set_song(&import_callback, bounced_song);
          \t\t\trc = verify_bounced_song(bounced_song, &wav_info);
          \t\t\tif (rc == 0) {
          \t\t\t\trc = compare_imported_pcm_with_wav(bounced_song,
          \t\t\t\t\trender_path, &wav_info);
          \t\t\t}
          \t\t}
          \t}
          \tif (rc == 0) {
          '''
          if old not in text:
              raise SystemExit('initial import verification block not found')
          text = text.replace(old, new, 1)

          old = '''\t\t} else {
          \t\t\tpsy_audio_machinecallback_set_song(&reload_callback, reloaded_song);
          \t\t\trc = verify_bounced_song(reloaded_song, &wav_info);
          \t\t\tif (rc == 0) {
          \t\t\t\trc = compare_bounced_pcm(bounced_song, reloaded_song);
          \t\t\t}
          \t\t}
          '''
          new = '''\t\t} else {
          \t\t\tpsy_audio_machinecallback_set_song(&reload_callback, reloaded_song);
          \t\t\trc = verify_bounced_song(reloaded_song, &wav_info);
          \t\t\tif (rc == 0) {
          \t\t\t\trc = compare_imported_pcm_with_wav(reloaded_song,
          \t\t\t\t\trender_path, &wav_info);
          \t\t\t}
          \t\t\tif (rc == 0) {
          \t\t\t\trc = compare_bounced_pcm(bounced_song, reloaded_song);
          \t\t\t}
          \t\t}
          '''
          if old not in text:
              raise SystemExit('reload verification block not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit strengthening and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-render-regression-strengthen.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/phase4_render_bounce_sampler.c .github/workflows/one-shot-render-regression-strengthen.yml
          git commit -m "test: strengthen render bounce PCM coverage"
          git push origin HEAD:phase-4/render-bounce-sampler
