name: One-shot Phase 4 roadmap evidence

on:
  push:
    branches:
      - phase-4/render-bounce-sampler

permissions:
  contents: write

jobs:
  roadmap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4/render-bounce-sampler
          fetch-depth: 0

      - name: Record completed Phase 4 slices
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('ROADMAP.md')
          text = path.read_text()

          replacements = {
              '- [ ] Sequencer editing and playback.': '- [x] Sequencer editing and playback.',
              '- [ ] Tempo, LPB/line timing, transport, loop and position behaviour.': '- [x] Tempo, LPB/line timing, transport, loop and position behaviour.',
              "- [ ] WAV/audio render through Psycle's existing `FileOutDriver` path.": "- [x] WAV/audio render through Psycle's existing `FileOutDriver` path.",
              '- [ ] Psycle-generated WAV → Psycle Sampler compatibility regression.': '- [x] Psycle-generated WAV → Psycle Sampler compatibility regression.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'roadmap row not found: {old}')
              text = text.replace(old, new, 1)

          marker = '''- [x] Psycle-generated WAV → Psycle Sampler compatibility regression.\n\n### Historical bounce-to-sampler acceptance workflow\n'''
          evidence = '''- [x] Psycle-generated WAV → Psycle Sampler compatibility regression.\n\nAutomated evidence for the completed sequencer/transport rows is provided by\n`.github/workflows/phase4-sequencer-transport.yml`; automated evidence for the\nrender/bounce rows is provided by `.github/workflows/phase4-render-bounce-sampler.yml`.\nThese gates complement rather than replace the remaining UI and real-device work.\n\n### Historical bounce-to-sampler acceptance workflow\n'''
          if marker not in text:
              raise SystemExit('Phase 4 evidence insertion point not found')
          text = text.replace(marker, evidence, 1)
          path.write_text(text)
          PY

      - name: Commit roadmap and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-roadmap-phase4-evidence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md .github/workflows/one-shot-roadmap-phase4-evidence.yml
          git commit -m "docs: record Phase 4 sequencer and render evidence"
          git push origin HEAD:phase-4/render-bounce-sampler
