name: Phase 2 Linux build audit

on:
  push:
    branches:
      - phase-2/modern-linux-build-audit
    paths:
      - 'cpsycle/**'
      - 'scripts/phase2-build-audit.sh'
      - '.github/workflows/phase2-linux-build-audit.yml'
  pull_request:
    paths:
      - 'cpsycle/**'
      - 'scripts/phase2-build-audit.sh'
      - '.github/workflows/phase2-linux-build-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install documented Linux development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            liblilv-dev \
            liblua5.4-dev \
            libfreetype-dev \
            libfontconfig-dev \
            libgl-dev \
            libx11-dev \
            libxft-dev \
            libxext-dev \
            libxmu-dev \
            libasound2-dev \
            libjack-jackd2-dev \
            libstk-dev \
            libsdl2-dev \
            libfluidsynth-dev

      - name: Run build audit
        run: |
          chmod +x scripts/phase2-build-audit.sh
          scripts/phase2-build-audit.sh build-audit
          cat build-audit/summary.md

      - name: Upload complete audit logs
        uses: actions/upload-artifact@v4
        with:
          name: phase2-linux-build-audit
          path: build-audit/
          if-no-files-found: error
          retention-days: 30
