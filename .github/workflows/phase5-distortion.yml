name: Phase 5 ayeternal Dist! Distortion preservation

on:
  push:
    branches:
      - main
      - 'phase-5/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distortion:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native-machine test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            liblilv-dev \
            liblua5.4-dev

      - name: Run Dist! Distortion preservation regression
        shell: bash
        run: |
          set -o pipefail
          chmod +x scripts/phase5-distortion-smoke.sh
          scripts/phase5-distortion-smoke.sh phase5-distortion \
            2>&1 | tee "$RUNNER_TEMP/phase5-distortion.log"

      - name: Upload Dist! Distortion evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phase5-distortion
          path: |
            phase5-distortion/
            ${{ runner.temp }}/phase5-distortion.log
          if-no-files-found: warn
