name: Phase 5 DW family preservation

on:
  push:
    branches:
      - main
      - 'phase-5/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dw-family:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native-machine test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            liblilv-dev \
            liblua5.4-dev

      - name: Run DW family preservation regression
        run: |
          chmod +x scripts/phase5-dw-family-smoke.sh
          scripts/phase5-dw-family-smoke.sh phase5-dw-family

      - name: Upload DW family evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase5-dw-family
          path: phase5-dw-family/
