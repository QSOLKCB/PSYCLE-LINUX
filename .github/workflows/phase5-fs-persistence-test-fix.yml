name: Phase 5 FluidSynth persistence test fix

on:
  push:
    branches:
      - 'phase-6b/filetypedetector-cstring'
    paths:
      - '.github/workflows/phase5-fs-persistence-test-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Split application from verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/phase5_fluidsynth_persistence.c')
          data = path.read_text()
          if 'static int verify_state(' in data:
              print('FluidSynth persistence verification split already present')
              raise SystemExit(0)

          old = '''static int apply_state(psy_audio_Machine* machine, const struct FluidState* expected)
          {
          \tpsy_audio_Preset captured;
          \tconst struct FluidState* actual;
          \tif (verify_identity(machine) != 0) return 1;
          \tpsy_audio_machine_put_data(machine, (uint8_t*)expected);
          \tpsy_audio_preset_init(&captured);
          \tpsy_audio_machine_current_preset(machine, &captured);
          \tif (psy_audio_preset_num_parameters(&captured) != PARAMETER_COUNT ||
          \t\t\tcaptured.datasize != DATA_SIZE || !captured.data) {
          \t\tpsy_audio_preset_dispose(&captured);
          \t\treturn fail("captured FluidSynth preset geometry changed");
          \t}
          \tactual = (const struct FluidState*)captured.data;
          \tif (!state_matches(actual, expected)) {
          \t\tpsy_audio_preset_dispose(&captured);
          \t\treturn fail("FluidSynth opaque state did not apply exactly");
          \t}
          \tpsy_audio_preset_dispose(&captured);
          \treturn 0;
          }
          '''

          new = '''static int verify_state(psy_audio_Machine* machine, const struct FluidState* expected)
          {
          \tpsy_audio_Preset captured;
          \tconst struct FluidState* actual;
          \tif (verify_identity(machine) != 0) return 1;
          \tpsy_audio_preset_init(&captured);
          \tpsy_audio_machine_current_preset(machine, &captured);
          \tif (psy_audio_preset_num_parameters(&captured) != PARAMETER_COUNT ||
          \t\t\tcaptured.datasize != DATA_SIZE || !captured.data) {
          \t\tpsy_audio_preset_dispose(&captured);
          \t\treturn fail("captured FluidSynth preset geometry changed");
          \t}
          \tactual = (const struct FluidState*)captured.data;
          \tif (!state_matches(actual, expected)) {
          \t\tpsy_audio_preset_dispose(&captured);
          \t\treturn fail("FluidSynth opaque state did not match exactly");
          \t}
          \tpsy_audio_preset_dispose(&captured);
          \treturn 0;
          }

          static int apply_state(psy_audio_Machine* machine, const struct FluidState* expected)
          {
          \tif (verify_identity(machine) != 0) return 1;
          \tpsy_audio_machine_put_data(machine, (uint8_t*)expected);
          \treturn verify_state(machine, expected);
          }
          '''

          if data.count(old) != 1:
              raise SystemExit(f'unexpected apply_state block count: {data.count(old)}')
          data = data.replace(old, new, 1)

          old_restore = '''\t\t\tpsy_audio_machine_tweak_preset(fresh, reloaded);
          \t\t\trc = apply_state(fresh, expected);'''
          new_restore = '''\t\t\tpsy_audio_machine_tweak_preset(fresh, reloaded);
          \t\t\trc = verify_state(fresh, expected);'''
          if data.count(old_restore) != 1:
              raise SystemExit(f'unexpected preset restore call count: {data.count(old_restore)}')
          data = data.replace(old_restore, new_restore, 1)

          path.write_text(data)
          print('FluidSynth persistence verification split applied')
          PY
          git diff --check

      - name: Commit test fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tests/phase5_fluidsynth_persistence.c
          if git diff --cached --quiet; then
            echo 'No persistence test commit required.'
            exit 0
          fi
          git commit -m 'test: verify FluidSynth preset restore without rewriting state'
          git push origin "HEAD:${GITHUB_REF_NAME}"
