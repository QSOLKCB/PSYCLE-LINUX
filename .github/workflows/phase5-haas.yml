name: Phase 5 Haas preservation

on:
  push:
    branches:
      - main
      - 'phase-5/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  haas:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native-machine test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            liblilv-dev \
            liblua5.4-dev

      - name: Run Haas preservation regression
        shell: bash
        run: |
          set -o pipefail
          chmod +x scripts/phase5-haas-smoke.sh
          scripts/phase5-haas-smoke.sh phase5-haas \
            2>&1 | tee "$RUNNER_TEMP/phase5-haas.log"

      - name: Upload Haas evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phase5-haas
          path: |
            phase5-haas/
            ${{ runner.temp }}/phase5-haas.log
          if-no-files-found: warn
