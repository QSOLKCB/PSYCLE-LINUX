name: Phase 5 LegaSynth TB303 preservation

on:
  push:
    branches:
      - main
      - 'phase-5/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legasynth:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native-machine test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            liblilv-dev \
            liblua5.4-dev

      - name: Run LegaSynth preservation regression
        shell: bash
        run: |
          set -o pipefail
          chmod +x scripts/phase5-legasynth-smoke.sh
          scripts/phase5-legasynth-smoke.sh phase5-legasynth \
            2>&1 | tee "$RUNNER_TEMP/phase5-legasynth.log"

      - name: Upload LegaSynth evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phase5-legasynth
          path: |
            phase5-legasynth/
            ${{ runner.temp }}/phase5-legasynth.log
          if-no-files-found: warn
