name: Phase 5 SChorus preservation

on:
  push:
    branches:
      - main
      - 'phase-5/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schorus:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native-machine test dependencies
        shell: bash
        run: |
          # Disable dedicated Microsoft APT source files on this runner.
          # These test dependencies are provided by Ubuntu repositories.
          for source in /etc/apt/sources.list.d/*.list \
                        /etc/apt/sources.list.d/*.sources; do
            [ -f "$source" ] || continue
            if grep -q 'packages\.microsoft\.com' "$source"; then
              sudo mv "$source" "${source}.disabled"
            fi
          done

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            liblilv-dev \
            liblua5.4-dev

      - name: Run SChorus preservation regression
        shell: bash
        run: |
          set -o pipefail
          chmod +x scripts/phase5-schorus-smoke.sh
          scripts/phase5-schorus-smoke.sh phase5-schorus \
            2>&1 | tee "$RUNNER_TEMP/phase5-schorus.log"

      - name: Upload SChorus evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phase5-schorus
          path: |
            phase5-schorus/
            ${{ runner.temp }}/phase5-schorus.log
          if-no-files-found: warn
