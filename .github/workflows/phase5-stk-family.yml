name: Phase 5 STK family preservation

on:
  push:
    branches:
      - main
      - 'phase-5/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stk-family:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native-machine test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            liblilv-dev \
            liblua5.4-dev \
            libstk-dev

      - name: Run STK family preservation regression
        shell: bash
        run: |
          set -o pipefail
          chmod +x scripts/phase5-stk-family-smoke.sh
          scripts/phase5-stk-family-smoke.sh phase5-stk-family \
            2>&1 | tee "$RUNNER_TEMP/phase5-stk-family.log"

      - name: Upload STK family evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phase5-stk-family
          path: |
            phase5-stk-family/
            ${{ runner.temp }}/phase5-stk-family.log
