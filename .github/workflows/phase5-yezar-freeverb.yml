name: Phase 5 Yezar Freeverb preservation

on:
  push:
    branches:
      - main
      - 'phase-5/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yezar-freeverb:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native-machine test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            liblilv-dev \
            liblua5.4-dev

      - name: Run Yezar Freeverb preservation regression
        run: |
          chmod +x scripts/phase5-yezar-freeverb-smoke.sh
          scripts/phase5-yezar-freeverb-smoke.sh phase5-yezar-freeverb

      - name: Upload Yezar Freeverb evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase5-yezar-freeverb
          path: phase5-yezar-freeverb/
