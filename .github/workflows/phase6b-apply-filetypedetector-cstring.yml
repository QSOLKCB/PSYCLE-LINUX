name: Phase 6B apply filetype detector cstring fix

on:
  push:
    branches:
      - 'phase-6b/filetypedetector-cstring'
    paths:
      - '.github/workflows/phase6b-apply-filetypedetector-cstring.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Apply exact compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib

          path = pathlib.Path('psycle-cpp-r12005-sanitized/psycle-helpers/src/psycle/helpers/filetypedetector.cpp')
          data = path.read_bytes()

          if b'#include <cstring>' in data:
              print('filetypedetector compatibility patch already present')
              raise SystemExit(0)

          newline = b'\r\n' if b'\r\n' in data else b'\n'
          include = b'#include "filetypedetector.hpp"' + newline
          if data.count(include) != 1:
              raise SystemExit('unexpected filetypedetector include layout')
          data = data.replace(include, include + b'#include <cstring>' + newline, 1)

          old = b'if ( strncmp(read,XI_STRING_ID,sizeof(read))) return false;'
          new = b'if (std::strncmp(read, XI_STRING_ID, sizeof(read)) != 0) return false;'
          if data.count(old) != 1:
              raise SystemExit(f'unexpected strncmp expression count: {data.count(old)}')
          data = data.replace(old, new, 1)

          path.write_bytes(data)
          print('filetypedetector compatibility patch applied')
          PY

      - name: Commit compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- psycle-cpp-r12005-sanitized/psycle-helpers/src/psycle/helpers/filetypedetector.cpp
          if git diff --cached --quiet; then
            echo 'No compatibility patch commit required.'
            exit 0
          fi
          git commit -m 'phase6b: fix filetype detector cstring declaration'
          git push origin "HEAD:${GITHUB_REF_NAME}"
