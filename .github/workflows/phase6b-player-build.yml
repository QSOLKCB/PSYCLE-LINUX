name: Phase 6B historical psycle-player build

on:
  push:
    branches:
      - 'phase-6b/source-baseline-player-build'
    paths:
      - 'psycle-cpp-r12005-sanitized/**'
      - 'scripts/phase6-upstream-audit.sh'
      - 'scripts/phase6b-sanitized-manifest.sh'
      - 'scripts/phase6b-verify-committed-source.sh'
      - 'scripts/phase6b-verify-qmake-support.sh'
      - 'scripts/phase6b-verify-build-system-src.sh'
      - '.github/workflows/phase6b-player-build.yml'
  pull_request:
    paths:
      - 'psycle-cpp-r12005-sanitized/**'
      - 'scripts/phase6-upstream-audit.sh'
      - 'scripts/phase6b-sanitized-manifest.sh'
      - 'scripts/phase6b-verify-committed-source.sh'
      - 'scripts/phase6b-verify-qmake-support.sh'
      - 'scripts/phase6b-verify-build-system-src.sh'
      - '.github/workflows/phase6b-player-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-player:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install historical build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            subversion \
            file \
            build-essential \
            pkg-config \
            qt5-qmake \
            qtbase5-dev \
            libboost-thread-dev \
            libboost-filesystem-dev \
            libboost-system-dev \
            libboost-chrono-dev \
            libboost-date-time-dev \
            libxml++2.6-dev \
            zlib1g-dev \
            libsoxr-dev \
            libasound2-dev \
            libjack-jackd2-dev

      - name: Verify sanitized source identities
        shell: bash
        run: |
          set -euo pipefail
          scripts/phase6-upstream-audit.sh phase6-upstream-audit
          bash scripts/phase6b-sanitized-manifest.sh \
            phase6-upstream-audit \
            phase6b-sanitized-manifest
          bash scripts/phase6b-verify-committed-source.sh \
            psycle-cpp-r12005-sanitized \
            phase6b-sanitized-manifest
          bash scripts/phase6b-verify-qmake-support.sh \
            psycle-cpp-r12005-sanitized/build-systems/qmake
          bash scripts/phase6b-verify-build-system-src.sh \
            psycle-cpp-r12005-sanitized/build-systems/src

      - name: Stage pinned historical plugin interface
        shell: bash
        run: |
          set -euo pipefail
          DEST='psycle-cpp-r12005-sanitized/psycle-plugins/src/psycle/plugin_interface.hpp'
          ARCHIVE_COMMIT='1863c4177d38d37e8eba9e4eb8857e5023debe6d'
          EXPECTED_BLOB='2cf4d8f756fa58098fd84b7b44d0ebe1350594c5'
          test ! -e "$DEST"
          mkdir -p "$(dirname "$DEST")"
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/QSOLKCB/PSYCLE-LINUX/${ARCHIVE_COMMIT}/cpsycle/plugins/psycle/plugin_interface.hpp" \
            -o "$DEST"
          actual_blob="$(git hash-object "$DEST")"
          if [[ "$actual_blob" != "$EXPECTED_BLOB" ]]; then
            echo "historical plugin interface blob mismatch: $actual_blob" >&2
            exit 2
          fi
          grep -Fq 'namespace psycle { namespace plugin_interface {' "$DEST"
          printf 'plugin-interface-archive-commit=%s\n' "$ARCHIVE_COMMIT"
          printf 'plugin-interface-blob=%s\n' "$actual_blob"

      - name: Probe and stage historical diversalis dependency
        shell: bash
        run: |
          set -euo pipefail
          DEST='psycle-cpp-r12005-sanitized/diversalis'
          test ! -e "$DEST"
          svn info -r 12005 'https://svn.code.sf.net/p/psycle/code/trunk/diversalis@12005'
          svn export --quiet --force -r 12005 \
            'https://svn.code.sf.net/p/psycle/code/trunk/diversalis@12005' \
            "$DEST"
          manifest="$(mktemp)"
          (
            cd "$DEST"
            find . -type f -print0 | sort -z | xargs -0 -r sha256sum
          ) > "$manifest"
          printf 'diversalis-file-count=%s\n' \
            "$(find "$DEST" -type f -printf '.' | wc -c | tr -d ' ')"
          printf 'diversalis-manifest-sha256=%s\n' \
            "$(sha256sum "$manifest" | awk '{print $1}')"
          printf '%s\n' '--- diversalis notice hints ---'
          grep -RniE 'copyright|licen[sc]e|gnu|gpl|permission|redistribut|author' "$DEST" || true

      - name: Configure historical qmake build
        shell: bash
        working-directory: psycle-cpp-r12005-sanitized/psycle-player
        run: |
          set -euo pipefail
          qmake CONFIG-=shared CONFIG+=release psycle-player.pro

      - name: Build historical psycle-player
        shell: bash
        working-directory: psycle-cpp-r12005-sanitized/psycle-player
        run: |
          set -euo pipefail
          make -j2

      - name: Verify player executable
        shell: bash
        run: |
          set -euo pipefail
          PLAYER='psycle-cpp-r12005-sanitized/psycle-player/++qmake/psycle-player'
          test -x "$PLAYER"
          "$PLAYER" --help
          "$PLAYER" --version
          file "$PLAYER"
