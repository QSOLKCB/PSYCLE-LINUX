name: Phase 6B source-bearing sanitized import

on:
  push:
    branches:
      - 'phase-6b/source-baseline-player-build'
    paths:
      - 'scripts/phase6-upstream-audit.sh'
      - 'scripts/phase6b-sanitized-manifest.sh'
      - 'scripts/phase6b-materialize-source.sh'
      - 'scripts/phase6b-verify-committed-source.sh'
      - 'scripts/phase6b-materialize-qmake-support.sh'
      - 'scripts/phase6b-verify-qmake-support.sh'
      - '.github/workflows/phase6b-source-import.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase6b-source-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import-sanitized-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Install provenance tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            subversion

      - name: Reproduce frozen Phase 6A receipt
        shell: bash
        run: |
          set -euo pipefail
          scripts/phase6-upstream-audit.sh phase6-upstream-audit

      - name: Reproduce Phase 6B retained manifest
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/phase6b-sanitized-manifest.sh \
            phase6-upstream-audit \
            phase6b-sanitized-manifest
          grep -Fqx '00cd95562b78303b82e17f62fff4b58622f7c0e78c0b4dd850d448082a53893a' \
            phase6b-sanitized-manifest/baseline.sha256

      - name: Materialize or verify committed component source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d psycle-cpp-r12005-sanitized/psycle-core ]]; then
            bash scripts/phase6b-verify-committed-source.sh \
              psycle-cpp-r12005-sanitized \
              phase6b-sanitized-manifest
          else
            bash scripts/phase6b-materialize-source.sh \
              phase6b-sanitized-manifest \
              psycle-cpp-r12005-sanitized
            rm -f psycle-cpp-r12005-sanitized/.phase6b-retained-manifest.sha256
            bash scripts/phase6b-verify-committed-source.sh \
              psycle-cpp-r12005-sanitized \
              phase6b-sanitized-manifest
          fi

      - name: Materialize or verify historical qmake support
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d psycle-cpp-r12005-sanitized/build-systems/qmake ]]; then
            bash scripts/phase6b-verify-qmake-support.sh \
              psycle-cpp-r12005-sanitized/build-systems/qmake
          else
            mkdir -p psycle-cpp-r12005-sanitized/build-systems
            bash scripts/phase6b-materialize-qmake-support.sh \
              psycle-cpp-r12005-sanitized/build-systems/qmake
            bash scripts/phase6b-verify-qmake-support.sh \
              psycle-cpp-r12005-sanitized/build-systems/qmake
          fi

      - name: Commit exact sanitized source baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- psycle-cpp-r12005-sanitized
          if git diff --cached --quiet; then
            echo 'Committed sanitized source and qmake support already match the frozen receipts.'
            exit 0
          fi
          git commit -m 'phase6b: add pinned historical qmake build support'
          git push origin "HEAD:${GITHUB_REF_NAME}"
