name: Phase 6B source-bearing sanitized import

on:
  push:
    branches:
      - 'phase-6b/source-baseline-player-build'
    paths:
      - 'scripts/phase6-upstream-audit.sh'
      - 'scripts/phase6b-sanitized-manifest.sh'
      - 'scripts/phase6b-materialize-source.sh'
      - 'scripts/phase6b-verify-committed-source.sh'
      - '.github/workflows/phase6b-source-import.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase6b-source-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import-sanitized-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Install provenance tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            subversion

      - name: Reproduce frozen Phase 6A receipt
        shell: bash
        run: |
          set -euo pipefail
          scripts/phase6-upstream-audit.sh phase6-upstream-audit

      - name: Reproduce Phase 6B retained manifest
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/phase6b-sanitized-manifest.sh \
            phase6-upstream-audit \
            phase6b-sanitized-manifest
          grep -Fqx '00cd95562b78303b82e17f62fff4b58622f7c0e78c0b4dd850d448082a53893a' \
            phase6b-sanitized-manifest/baseline.sha256

      - name: Materialize or verify committed source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d psycle-cpp-r12005-sanitized ]]; then
            bash scripts/phase6b-verify-committed-source.sh \
              psycle-cpp-r12005-sanitized \
              phase6b-sanitized-manifest
          else
            bash scripts/phase6b-materialize-source.sh \
              phase6b-sanitized-manifest \
              psycle-cpp-r12005-sanitized
            rm -f psycle-cpp-r12005-sanitized/.phase6b-retained-manifest.sha256
            bash scripts/phase6b-verify-committed-source.sh \
              psycle-cpp-r12005-sanitized \
              phase6b-sanitized-manifest
          fi

      - name: Probe historical qmake support boundary
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          url='https://svn.code.sf.net/p/psycle/code/trunk/build-systems/qmake@12005'
          svn info -r 12005 "$url" > "$work/svn-info.txt"
          svn export --quiet --force -r 12005 "$url" "$work/qmake"
          (
            cd "$work/qmake"
            find . -type f -print0 | sort -z | xargs -0 -r sha256sum
          ) > "$work/files.sha256"
          printf '%s\n' '--- phase6b qmake support probe ---'
          cat "$work/svn-info.txt"
          printf 'file-count=%s\n' "$(find "$work/qmake" -type f -printf '.' | wc -c | tr -d ' ')"
          printf 'manifest-sha256=%s\n' "$(sha256sum "$work/files.sha256" | awk '{print $1}')"
          printf '%s\n' '--- files ---'
          cat "$work/files.sha256"
          printf '%s\n' '--- notice hints ---'
          grep -RniE 'copyright|licen[sc]e|gnu|gpl|permission|redistribut|author' "$work/qmake" || true

      - name: Commit exact sanitized source baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- psycle-cpp-r12005-sanitized
          if git diff --cached --quiet; then
            echo 'Committed sanitized source already matches the frozen receipt.'
            exit 0
          fi
          git commit -m 'phase6b: import exact sanitized r12005 C++ baseline'
          git push origin "HEAD:${GITHUB_REF_NAME}"
