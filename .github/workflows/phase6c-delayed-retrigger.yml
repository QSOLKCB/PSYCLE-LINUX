name: Phase 6C delayed retrigger observation

on:
  push:
    branches:
      - main
      - 'phase-6c/**'
    paths:
      - 'phase6c/DELAYED_RETRIGGER.md'
      - 'phase6c/evidence/sequencer-delayed-retrigger/**'
      - 'phase6c/evidence/sequencer-sampler-fault-location/**'
      - 'phase6c/evidence/sequencer-sampler-work-boundary/**'
      - 'phase6c/compatibility-matrix.json'
      - 'scripts/phase6c-validate-matrix.py'
      - 'PSYCLE_CORE_PARITY.md'
      - 'ROADMAP.md'
      - 'tests/phase6c_delayed_retrigger*'
      - 'tests/phase6c_sampler_voice_startup_fixture.c'
      - 'tests/phase6c_sampler_work_boundary_fixture.c'
      - 'tests/phase6c_sampler_fault_location.py'
      - 'scripts/phase6c-delayed-retrigger-*'
      - 'scripts/phase6c-sampulse-eins-compat.py'
      - 'scripts/phase6c-sampler-voice-startup.py'
      - 'scripts/phase6c-sampler-work-boundary.py'
      - 'scripts/phase6c-sampler-fault-location.py'
      - 'scripts/phase6c-sampler-fault-location.ps1'
      - 'scripts/phase6c-build-delayed-retrigger-observer.py'
      - 'scripts/phase6c-original-windows-fixtures.ps1'
      - 'scripts/phase6c-original-audio-render.ps1'
      - 'scripts/phase6c-original-windows-fixtures-v2.ps1'
      - 'scripts/phase6c-validate-original-receipts-v2.py'
      - 'scripts/phase6-upstream-audit.sh'
      - 'scripts/phase6b-sanitized-manifest.sh'
      - 'scripts/phase6b-verify-committed-source.sh'
      - 'scripts/phase6b-verify-qmake-support.sh'
      - 'scripts/phase6c-candidate-fixtures.sh'
      - 'scripts/phase6c-candidate-parse.py'
      - 'scripts/phase4-historical-psy2-smoke.sh'
      - 'scripts/phase4-core-workflow-smoke.sh'
      - 'tests/phase4_historical_psy2.c'
      - 'tests/phase4_core_workflow.c'
      - 'psycle-cpp-r12005-sanitized/**'
      - 'cpsycle/**'
      - '.github/workflows/phase6c-delayed-retrigger.yml'
  pull_request:
    paths:
      - 'phase6c/DELAYED_RETRIGGER.md'
      - 'phase6c/evidence/sequencer-delayed-retrigger/**'
      - 'phase6c/evidence/sequencer-sampler-fault-location/**'
      - 'phase6c/evidence/sequencer-sampler-work-boundary/**'
      - 'phase6c/compatibility-matrix.json'
      - 'scripts/phase6c-validate-matrix.py'
      - 'PSYCLE_CORE_PARITY.md'
      - 'ROADMAP.md'
      - 'tests/phase6c_delayed_retrigger*'
      - 'tests/phase6c_sampler_voice_startup_fixture.c'
      - 'tests/phase6c_sampler_work_boundary_fixture.c'
      - 'tests/phase6c_sampler_fault_location.py'
      - 'scripts/phase6c-delayed-retrigger-*'
      - 'scripts/phase6c-sampulse-eins-compat.py'
      - 'scripts/phase6c-sampler-voice-startup.py'
      - 'scripts/phase6c-sampler-work-boundary.py'
      - 'scripts/phase6c-sampler-fault-location.py'
      - 'scripts/phase6c-sampler-fault-location.ps1'
      - 'scripts/phase6c-build-delayed-retrigger-observer.py'
      - 'scripts/phase6c-original-windows-fixtures.ps1'
      - 'scripts/phase6c-original-audio-render.ps1'
      - 'scripts/phase6c-original-windows-fixtures-v2.ps1'
      - 'scripts/phase6c-validate-original-receipts-v2.py'
      - 'scripts/phase6-upstream-audit.sh'
      - 'scripts/phase6b-sanitized-manifest.sh'
      - 'scripts/phase6b-verify-committed-source.sh'
      - 'scripts/phase6b-verify-qmake-support.sh'
      - 'scripts/phase6c-candidate-fixtures.sh'
      - 'scripts/phase6c-candidate-parse.py'
      - 'scripts/phase4-historical-psy2-smoke.sh'
      - 'scripts/phase4-core-workflow-smoke.sh'
      - 'tests/phase4_historical_psy2.c'
      - 'tests/phase4_core_workflow.c'
      - 'psycle-cpp-r12005-sanitized/**'
      - 'cpsycle/**'
      - '.github/workflows/phase6c-delayed-retrigger.yml'
  workflow_dispatch:
    inputs:
      sampler_fault_location:
        description: 'Collect the opt-in pinned-original Sampler exception/module-offset witness'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: phase6c-delayed-retrigger-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-command-observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl subversion file build-essential pkg-config \
            qt5-qmake qtbase5-dev libboost-thread-dev libboost-filesystem-dev \
            libboost-system-dev libboost-chrono-dev libboost-date-time-dev \
            libxml++2.6-dev zlib1g-dev libsoxr-dev libasound2-dev \
            libjack-jackd2-dev liblilv-dev liblua5.4-dev

      - name: Check delayed command negative controls
        run: python3 tests/phase6c_delayed_retrigger.py

      - name: Check offline render analyzer negative controls
        run: python3 tests/phase6c_delayed_retrigger_render.py

      - name: Check Sampler fault-location negative controls
        run: python3 tests/phase6c_sampler_fault_location.py

      - name: Check same-witness Sampulse render negative controls
        run: python3 tests/phase6c_delayed_retrigger_same_witness.py

      - name: Validate versioned compatibility matrix
        run: python3 scripts/phase6c-validate-matrix.py phase6c/compatibility-matrix.json

      - name: Verify frozen Phase 6B source identities
        shell: bash
        run: |
          set -euo pipefail
          scripts/phase6-upstream-audit.sh phase6-upstream-audit
          bash scripts/phase6b-sanitized-manifest.sh \
            phase6-upstream-audit phase6b-sanitized-manifest
          bash scripts/phase6b-verify-committed-source.sh \
            psycle-cpp-r12005-sanitized phase6b-sanitized-manifest
          bash scripts/phase6b-verify-qmake-support.sh \
            psycle-cpp-r12005-sanitized/build-systems/qmake

      - name: Stage pinned historical plugin interface
        shell: bash
        run: |
          set -euo pipefail
          DEST='psycle-cpp-r12005-sanitized/psycle-plugins/src/psycle/plugin_interface.hpp'
          ARCHIVE_COMMIT='1863c4177d38d37e8eba9e4eb8857e5023debe6d'
          EXPECTED_BLOB='2cf4d8f756fa58098fd84b7b44d0ebe1350594c5'
          test ! -e "$DEST"
          mkdir -p "$(dirname "$DEST")"
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/QSOLKCB/PSYCLE-LINUX/${ARCHIVE_COMMIT}/cpsycle/plugins/psycle/plugin_interface.hpp" \
            -o "$DEST"
          [[ "$(git hash-object "$DEST")" == "$EXPECTED_BLOB" ]]

      - name: Stage pinned historical diversalis dependency
        shell: bash
        run: |
          set -euo pipefail
          DEST='psycle-cpp-r12005-sanitized/diversalis'
          test ! -e "$DEST"
          exported=false
          for attempt in 1 2 3 4; do
            rm -rf -- "$DEST"
            if svn export --quiet --force -r 12005 \
              'https://svn.code.sf.net/p/psycle/code/trunk/diversalis@12005' "$DEST"; then
              exported=true
              break
            fi
            sleep "$((attempt * 2))"
          done
          [[ "$exported" == true ]]

      - name: Build pinned historical player support
        shell: bash
        working-directory: psycle-cpp-r12005-sanitized/psycle-player
        run: |
          set -euo pipefail
          qmake CONFIG-=shared CONFIG+=release psycle-player.pro
          make -j2

      - name: Collect shared parse fixtures for original harness
        shell: bash
        run: bash scripts/phase6c-candidate-fixtures.sh phase6c-command-evidence

      - name: Collect candidate delayed/retrigger evidence
        shell: bash
        run: bash scripts/phase6c-delayed-retrigger-candidate.sh phase6c-command-evidence

      - name: Bind pinned original command source
        shell: bash
        run: |
          set -euo pipefail
          SRC="$(mktemp -d)"
          trap 'rm -rf -- "$SRC"' EXIT
          COMMIT='7ac6d2c3553e2ee8dda55814d8e689919c345478'
          PLAYER_BLOB='b5c962cbcc15f267b9fa1ffe1c9ab21d881b8dbc'
          STRUCTS_BLOB='3ad8cd1b1a0a41bc2225cfd3070bf205cbebec31'
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/jpaquim/psycle/${COMMIT}/psycle/src/psycle/host/Player.cpp" \
            -o "$SRC/Player.cpp"
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/jpaquim/psycle/${COMMIT}/psycle/src/psycle/host/SongStructs.hpp" \
            -o "$SRC/SongStructs.hpp"
          [[ "$(git hash-object "$SRC/Player.cpp")" == "$PLAYER_BLOB" ]]
          [[ "$(git hash-object "$SRC/SongStructs.hpp")" == "$STRUCTS_BLOB" ]]
          python3 scripts/phase6c-delayed-retrigger-evidence.py source \
            phase6c-command-evidence "$SRC/Player.cpp" "$SRC/SongStructs.hpp"
          python3 scripts/phase6c-delayed-retrigger-evidence.py source-check \
            phase6c-command-evidence
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/jpaquim/psycle/$COMMIT/psycle/src/psycle/host/Sampler.cpp" \
            -o "$SRC/Sampler.cpp"
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/jpaquim/psycle/$COMMIT/psycle/src/psycle/host/Song.cpp" \
            -o "$SRC/Song.cpp"
          [[ "$(git hash-object "$SRC/Sampler.cpp")" == "6cc0bd7328d01131c3d41b68f4e5d4189959e364" ]]
          [[ "$(git hash-object "$SRC/Song.cpp")" == "9ed00469d29d0a5714cc7b86175d0dc4c6048e3a" ]]
          python3 scripts/phase6c-sampler-voice-startup.py source \
            phase6c-command-evidence "$SRC/Sampler.cpp" "$SRC/Song.cpp"
          python3 scripts/phase6c-sampler-voice-startup.py source-check \
            phase6c-command-evidence
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/jpaquim/psycle/$COMMIT/psycle/src/psycle/host/Sampler.hpp" \
            -o "$SRC/Sampler.hpp"
          [[ "$(git hash-object "$SRC/Sampler.hpp")" == "46da9fa80757b11ed146a21a529c70dbc6364f12" ]]
          python3 scripts/phase6c-sampler-work-boundary.py source \
            phase6c-command-evidence "$SRC/Sampler.cpp" "$SRC/Sampler.hpp" "$SRC/SongStructs.hpp"
          python3 scripts/phase6c-sampler-work-boundary.py source-check \
            phase6c-command-evidence
          python3 scripts/phase6c-sampler-fault-location.py candidate \
            phase6c-command-evidence
          python3 scripts/phase6c-sampler-fault-location.py candidate-check \
            phase6c-command-evidence

      - name: Pack candidate command evidence
        shell: bash
        run: |
          set -euo pipefail
          # upload-artifact normalizes file modes. Keep the retained Linux
          # renderer's executable bit inside a tar archive for replay.
          tar -C phase6c-command-evidence -cf phase6c-command-evidence.tar .
          tar -tf phase6c-command-evidence.tar >/dev/null

      - name: Upload candidate command evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6c-delayed-retrigger-candidate
          path: phase6c-command-evidence.tar
          if-no-files-found: warn

  original-command-observation:
    needs: candidate-command-observation
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download exact candidate command artifact
        uses: actions/download-artifact@v4
        with:
          name: phase6c-delayed-retrigger-candidate
          path: phase6c-command-candidate-artifact

      - name: Extract exact candidate command artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path phase6c-command-candidate -Force | Out-Null
          & tar.exe -xf phase6c-command-candidate-artifact/phase6c-command-evidence.tar -C phase6c-command-candidate
          if ($LASTEXITCODE -ne 0) { throw "candidate command evidence extraction failed" }

      - name: Install pinned Microsoft VC90 x86 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://download.microsoft.com/download/5/D/8/5D8C65CB-C849-4025-8E95-C3966CAFD8AE/vcredist_x86.exe'
          $expectedSha = '8742bcbf24ef328a72d2a27b693cc7071e38d3bb4b9b44dec42aa3d2c8d61d92'
          $version = '9.0.30729.6161'
          $runtime = Join-Path $env:RUNNER_TEMP 'psycle-vc90-vcredist_x86.exe'
          $receipt = Join-Path $PWD 'phase6c-vc90-runtime.txt'
          & curl.exe --fail --location --retry 3 --silent --show-error --output $runtime $url
          if ($LASTEXITCODE -ne 0) { throw "VC90 runtime download failed" }
          $actualSha = (Get-FileHash -LiteralPath $runtime -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha -ne $expectedSha) { throw "VC90 runtime SHA-256 mismatch" }
          $signature = Get-AuthenticodeSignature -FilePath $runtime
          if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate -or
              $signature.SignerCertificate.Subject -notmatch '(?i)Microsoft') {
            throw "VC90 runtime signature is not valid Microsoft Authenticode"
          }
          $process = Start-Process -FilePath $runtime -ArgumentList '/Q','/NORESTART' -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) { throw "VC90 runtime install failed" }
          @(
            "runtime=Microsoft Visual C++ 2008 SP1 x86 Redistributable MFC Security Update"
            "redistributable_version=$version"
            "url=$url"
            "sha256=$actualSha"
            "authenticode_status=$($signature.Status)"
            "signer_subject=$($signature.SignerCertificate.Subject)"
            "installer_exit_code=$($process.ExitCode)"
          ) | Set-Content -LiteralPath $receipt -Encoding utf8
          Remove-Item -LiteralPath $runtime -Force
          "PSYCLE_PHASE6C_VC90_RUNTIME_URL=$url" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PSYCLE_PHASE6C_VC90_RUNTIME_SHA256=$actualSha" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PSYCLE_PHASE6C_VC90_RUNTIME_VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PSYCLE_PHASE6C_VC90_RUNTIME_RECEIPT=$receipt" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Generate and parse delayed/retrigger observer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'scripts/phase6c-original-windows-fixtures-v2.ps1'
          $generated = 'scripts/phase6c-original-windows-fixtures-v2.generated.ps1'
          python scripts/phase6c-build-delayed-retrigger-observer.py $base $generated
          if ($LASTEXITCODE -ne 0) { throw "delayed observer generation failed" }
          foreach ($path in @(
            $generated,
            'scripts/phase6c-original-windows-fixtures.ps1',
            'scripts/phase6c-original-audio-render.ps1',
            'scripts/phase6c-sampler-fault-location.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object {
                Write-Error ("PowerShell parse error in ${path}: " + $_.Message)
              }
              throw "PowerShell parse failed"
            }
          }
          Move-Item -LiteralPath $generated -Destination $base -Force

      - name: Observe pinned original delayed/retrigger fixture
        shell: pwsh
        env:
          PSYCLE_PHASE6C_COLLECT_FAULT_LOCATION: ${{ github.event_name == 'workflow_dispatch' && inputs.sampler_fault_location }}
        run: |
          $ErrorActionPreference = 'Stop'
          $collectFaultLocation = $env:PSYCLE_PHASE6C_COLLECT_FAULT_LOCATION -eq 'true'
          ./scripts/phase6c-original-windows-fixtures.ps1 `
            -CandidateArtifactRoot 'phase6c-command-candidate' `
            -Out 'phase6c-command-original' `
            -ObserveDelayedRetrigger `
            -CollectSamplerFaultLocation:$collectFaultLocation

      - name: Validate command observations
        shell: pwsh
        env:
          PSYCLE_PHASE6C_COLLECT_FAULT_LOCATION: ${{ github.event_name == 'workflow_dispatch' && inputs.sampler_fault_location }}
        run: |
          $ErrorActionPreference = 'Stop'
          $collectFaultLocation = $env:PSYCLE_PHASE6C_COLLECT_FAULT_LOCATION -eq 'true'
          python scripts/phase6c-delayed-retrigger-evidence.py candidate phase6c-command-candidate
          if ($LASTEXITCODE -ne 0) { throw "candidate command validation failed" }
          python scripts/phase6c-delayed-retrigger-evidence.py source-check phase6c-command-candidate
          if ($LASTEXITCODE -ne 0) { throw "original-source validation failed" }
          python scripts/phase6c-delayed-retrigger-original.py `
            phase6c-command-candidate phase6c-command-original
          if ($LASTEXITCODE -ne 0) { throw "original command validation failed" }
          python scripts/phase6c-delayed-retrigger-render-evidence.py candidate-check phase6c-command-candidate
          if ($LASTEXITCODE -ne 0) { throw "execution witness candidate validation failed" }
          python scripts/phase6c-delayed-retrigger-render-evidence.py original `
            phase6c-command-candidate phase6c-command-original
          if ($LASTEXITCODE -ne 0) { throw "original execution witness validation failed" }
          python scripts/phase6c-delayed-retrigger-render-isolation.py candidate-check `
            phase6c-command-candidate
          if ($LASTEXITCODE -ne 0) { throw "render isolation candidate validation failed" }
          python scripts/phase6c-delayed-retrigger-render-isolation.py original `
            phase6c-command-candidate phase6c-command-original
          if ($LASTEXITCODE -ne 0) { throw "original render isolation validation failed" }
          python scripts/phase6c-delayed-retrigger-render-substrate.py candidate-check `
            phase6c-command-candidate
          if ($LASTEXITCODE -ne 0) { throw "render substrate candidate validation failed" }
          python scripts/phase6c-delayed-retrigger-render-substrate.py original `
            phase6c-command-candidate phase6c-command-original
          if ($LASTEXITCODE -ne 0) { throw "original render substrate validation failed" }
          python scripts/phase6c-sampler-voice-startup.py candidate-check `
            phase6c-command-candidate
          if ($LASTEXITCODE -ne 0) { throw "Sampler voice-startup candidate validation failed" }
          python scripts/phase6c-sampler-voice-startup.py source-check `
            phase6c-command-candidate
          if ($LASTEXITCODE -ne 0) { throw "Sampler voice-startup source validation failed" }
          python scripts/phase6c-sampler-voice-startup.py original `
            phase6c-command-candidate phase6c-command-original
          if ($LASTEXITCODE -ne 0) { throw "original Sampler voice-startup validation failed" }
          python scripts/phase6c-sampler-work-boundary.py candidate-check `
            phase6c-command-candidate
          if ($LASTEXITCODE -ne 0) { throw "Sampler work-boundary candidate validation failed" }
          python scripts/phase6c-sampler-work-boundary.py source-check `
            phase6c-command-candidate
          if ($LASTEXITCODE -ne 0) { throw "Sampler work-boundary source validation failed" }
          python scripts/phase6c-sampler-work-boundary.py projection-check
          if ($LASTEXITCODE -ne 0) { throw "frozen Sampler work-boundary projection validation failed" }
          python scripts/phase6c-sampler-work-boundary.py original-rerun `
            phase6c-command-candidate phase6c-command-original
          if ($LASTEXITCODE -ne 0) { throw "fresh Sampler work-boundary rerun validation failed" }
          python scripts/phase6c-sampler-fault-location.py candidate-check `
            phase6c-command-candidate
          if ($LASTEXITCODE -ne 0) { throw "Sampler fault-location candidate validation failed" }
          python scripts/phase6c-delayed-retrigger-same-witness.py candidate-check `
            phase6c-command-candidate
          if ($LASTEXITCODE -ne 0) { throw "same-witness Sampulse candidate validation failed" }
          python scripts/phase6c-delayed-retrigger-same-witness.py original `
            phase6c-command-candidate phase6c-command-original
          if ($LASTEXITCODE -ne 0) { throw "same-witness Sampulse original validation failed" }
          if ($collectFaultLocation) {
            python scripts/phase6c-sampler-fault-location.py original `
              phase6c-command-candidate phase6c-command-original
            if ($LASTEXITCODE -ne 0) { throw "original Sampler fault-location validation failed" }
            $summaryPath = 'phase6c-command-original/original-sampler-fault-location-summary.json'
            if (-not (Test-Path -LiteralPath $summaryPath -PathType Leaf)) {
              throw "Sampler fault-location summary missing after validation"
            }
            Write-Host '--- PHASE6C_SAMPLER_FAULT_LOCATION_SUMMARY_BEGIN ---'
            Get-Content -LiteralPath $summaryPath -Raw | Write-Host
            Write-Host '--- PHASE6C_SAMPLER_FAULT_LOCATION_SUMMARY_END ---'
          } else {
            Write-Host "Sampler fault-location witness disabled for this run"
          }

      - name: Upload original command evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6c-delayed-retrigger-original
          path: phase6c-command-original/
          if-no-files-found: warn
