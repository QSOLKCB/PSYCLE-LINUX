name: Phase 6C Sampler PS1 extended timing witness

on:
  push:
    branches:
      - main
      - 'phase-6c/**'
    paths:
      - 'phase6c/SAMPLER_PS1.md'
      - 'phase6c/evidence/sampler-ps1/**'
      - 'phase6c/compatibility-matrix.json'
      - 'ROADMAP.md'
      - 'PSYCLE_CORE_PARITY.md'
      - 'scripts/phase6-upstream-audit.sh'
      - 'scripts/phase6b-sanitized-manifest.sh'
      - 'scripts/phase6b-verify-committed-source.sh'
      - 'scripts/phase6b-verify-qmake-support.sh'
      - 'scripts/phase6c-sampler-ps1-contract.py'
      - 'scripts/phase6c-validate-matrix.py'
      - 'scripts/phase6c-sampler-ps1-pitch.py'
      - 'scripts/phase6c-sampler-ps1-pitch-compat.py'
      - 'scripts/phase6c-sampler-ps1-extended-timing*'
      - 'scripts/phase6c-build-sampler-ps1-extended-timing-observer.py'
      - 'scripts/phase6c-original-windows-fixtures.ps1'
      - 'scripts/phase6c-original-windows-fixtures-v2.ps1'
      - 'scripts/phase6c-original-audio-render.ps1'
      - 'tests/phase6c_sampler_ps1_extended_timing*'
      - 'psycle-cpp-r12005-sanitized/**'
      - 'cpsycle/**'
      - '.github/workflows/phase6c-sampler-ps1-extended-timing.yml'
  pull_request:
    paths:
      - 'phase6c/SAMPLER_PS1.md'
      - 'phase6c/evidence/sampler-ps1/**'
      - 'phase6c/compatibility-matrix.json'
      - 'ROADMAP.md'
      - 'PSYCLE_CORE_PARITY.md'
      - 'scripts/phase6-upstream-audit.sh'
      - 'scripts/phase6b-sanitized-manifest.sh'
      - 'scripts/phase6b-verify-committed-source.sh'
      - 'scripts/phase6b-verify-qmake-support.sh'
      - 'scripts/phase6c-sampler-ps1-contract.py'
      - 'scripts/phase6c-validate-matrix.py'
      - 'scripts/phase6c-sampler-ps1-pitch.py'
      - 'scripts/phase6c-sampler-ps1-pitch-compat.py'
      - 'scripts/phase6c-sampler-ps1-extended-timing*'
      - 'scripts/phase6c-build-sampler-ps1-extended-timing-observer.py'
      - 'scripts/phase6c-original-windows-fixtures.ps1'
      - 'scripts/phase6c-original-windows-fixtures-v2.ps1'
      - 'scripts/phase6c-original-audio-render.ps1'
      - 'tests/phase6c_sampler_ps1_extended_timing*'
      - 'psycle-cpp-r12005-sanitized/**'
      - 'cpsycle/**'
      - '.github/workflows/phase6c-sampler-ps1-extended-timing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase6c-sampler-ps1-extended-timing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-extended-timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl subversion file build-essential pkg-config \
            qt5-qmake qtbase5-dev libboost-thread-dev libboost-filesystem-dev \
            libboost-system-dev libboost-chrono-dev libboost-date-time-dev \
            libxml++2.6-dev zlib1g-dev libsoxr-dev libasound2-dev \
            libjack-jackd2-dev liblilv-dev liblua5.4-dev

      - name: Validate Phase 6C matrix contract
        run: python3 scripts/phase6c-validate-matrix.py phase6c/compatibility-matrix.json

      - name: Verify source-semantic Sampler baseline
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/psycle-original-sampler-ps1"
          rm -rf -- "$SRC"
          mkdir -p "$SRC"
          COMMIT='7ac6d2c3553e2ee8dda55814d8e689919c345478'
          CPP_BLOB='6cc0bd7328d01131c3d41b68f4e5d4189959e364'
          HPP_BLOB='46da9fa80757b11ed146a21a529c70dbc6364f12'
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/jpaquim/psycle/$COMMIT/psycle/src/psycle/host/Sampler.cpp" \
            -o "$SRC/Sampler.cpp"
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/jpaquim/psycle/$COMMIT/psycle/src/psycle/host/Sampler.hpp" \
            -o "$SRC/Sampler.hpp"
          [[ "$(git hash-object "$SRC/Sampler.cpp")" == "$CPP_BLOB" ]]
          [[ "$(git hash-object "$SRC/Sampler.hpp")" == "$HPP_BLOB" ]]
          python3 scripts/phase6c-sampler-ps1-contract.py check \
            "$SRC/Sampler.cpp" "$SRC/Sampler.hpp" \
            phase6c/evidence/sampler-ps1/source-contract.json

      - name: Verify frozen Phase 6B source identities
        shell: bash
        run: |
          set -euo pipefail
          scripts/phase6-upstream-audit.sh phase6-upstream-audit
          bash scripts/phase6b-sanitized-manifest.sh \
            phase6-upstream-audit phase6b-sanitized-manifest
          bash scripts/phase6b-verify-committed-source.sh \
            psycle-cpp-r12005-sanitized phase6b-sanitized-manifest
          bash scripts/phase6b-verify-qmake-support.sh \
            psycle-cpp-r12005-sanitized/build-systems/qmake

      - name: Stage pinned historical plugin interface
        shell: bash
        run: |
          set -euo pipefail
          DEST='psycle-cpp-r12005-sanitized/psycle-plugins/src/psycle/plugin_interface.hpp'
          ARCHIVE_COMMIT='1863c4177d38d37e8eba9e4eb8857e5023debe6d'
          EXPECTED_BLOB='2cf4d8f756fa58098fd84b7b44d0ebe1350594c5'
          test ! -e "$DEST"
          mkdir -p "$(dirname "$DEST")"
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/QSOLKCB/PSYCLE-LINUX/$ARCHIVE_COMMIT/cpsycle/plugins/psycle/plugin_interface.hpp" \
            -o "$DEST"
          [[ "$(git hash-object "$DEST")" == "$EXPECTED_BLOB" ]]

      - name: Stage pinned historical diversalis dependency
        shell: bash
        run: |
          set -euo pipefail
          DEST='psycle-cpp-r12005-sanitized/diversalis'
          test ! -e "$DEST"
          exported=false
          for attempt in 1 2 3 4; do
            rm -rf -- "$DEST"
            if svn export --quiet --force -r 12005 \
              'https://svn.code.sf.net/p/psycle/code/trunk/diversalis@12005' "$DEST"; then
              exported=true
              break
            fi
            sleep "$((attempt * 2))"
          done
          [[ "$exported" == true ]]

      - name: Build pinned historical player support
        shell: bash
        working-directory: psycle-cpp-r12005-sanitized/psycle-player
        run: |
          set -euo pipefail
          qmake CONFIG-=shared CONFIG+=release psycle-player.pro
          make -j2

      - name: Collect candidate PS1 extended timing evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir phase6c-ps1-extended-timing-candidate
          bash scripts/phase6c-sampler-ps1-extended-timing-candidate.sh \
            phase6c-ps1-extended-timing-candidate

      - name: Validate candidate PS1 extended timing evidence
        run: |
          python3 scripts/phase6c-sampler-ps1-extended-timing.py candidate-check \
            phase6c-ps1-extended-timing-candidate

      - name: Upload candidate PS1 extended timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6c-sampler-ps1-extended-timing-candidate
          path: phase6c-ps1-extended-timing-candidate/
          if-no-files-found: warn

  original-extended-timing:
    needs: candidate-extended-timing
    runs-on: windows-2022
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download exact candidate timing artifact
        uses: actions/download-artifact@v4
        with:
          name: phase6c-sampler-ps1-extended-timing-candidate
          path: phase6c-ps1-extended-timing-candidate

      - name: Install pinned Microsoft VC90 x86 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://download.microsoft.com/download/5/D/8/5D8C65CB-C849-4025-8E95-C3966CAFD8AE/vcredist_x86.exe'
          $expectedSha = '8742bcbf24ef328a72d2a27b693cc7071e38d3bb4b9b44dec42aa3d2c8d61d92'
          $version = '9.0.30729.6161'
          $runtime = Join-Path $env:RUNNER_TEMP 'psycle-vc90-vcredist_x86.exe'
          $receipt = Join-Path $PWD 'phase6c-vc90-runtime.txt'
          & curl.exe --fail --location --retry 3 --silent --show-error --output $runtime $url
          if ($LASTEXITCODE -ne 0) { throw "VC90 runtime download failed" }
          $actualSha = (Get-FileHash -LiteralPath $runtime -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha -ne $expectedSha) { throw "VC90 runtime SHA-256 mismatch" }
          $signature = Get-AuthenticodeSignature -FilePath $runtime
          if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate -or
              $signature.SignerCertificate.Subject -notmatch '(?i)Microsoft') {
            throw "VC90 runtime signature is not valid Microsoft Authenticode"
          }
          $process = Start-Process -FilePath $runtime -ArgumentList '/Q','/NORESTART' -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) { throw "VC90 runtime install failed" }
          @(
            "runtime=Microsoft Visual C++ 2008 SP1 x86 Redistributable MFC Security Update"
            "redistributable_version=$version"
            "url=$url"
            "sha256=$actualSha"
            "authenticode_status=$($signature.Status)"
            "signer_subject=$($signature.SignerCertificate.Subject)"
            "installer_exit_code=$($process.ExitCode)"
          ) | Set-Content -LiteralPath $receipt -Encoding utf8
          Remove-Item -LiteralPath $runtime -Force
          "PSYCLE_PHASE6C_VC90_RUNTIME_URL=$url" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PSYCLE_PHASE6C_VC90_RUNTIME_SHA256=$actualSha" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PSYCLE_PHASE6C_VC90_RUNTIME_VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PSYCLE_PHASE6C_VC90_RUNTIME_RECEIPT=$receipt" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Generate and parse PS1 extended timing observer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'scripts/phase6c-original-windows-fixtures-v2.ps1'
          $generated = 'scripts/phase6c-original-windows-fixtures-v2.generated.ps1'
          python scripts/phase6c-build-sampler-ps1-extended-timing-observer.py $base $generated
          if ($LASTEXITCODE -ne 0) { throw "PS1 timing observer generation failed" }
          foreach ($path in @(
            $generated,
            'scripts/phase6c-original-windows-fixtures.ps1',
            'scripts/phase6c-original-audio-render.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object {
                Write-Error ("PowerShell parse error in ${path}: " + $_.Message)
              }
              throw "PowerShell parse failed"
            }
          }
          Move-Item -LiteralPath $generated -Destination $base -Force

      - name: Observe pinned original PS1 extended timing fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/phase6c-original-windows-fixtures.ps1 `
            -CandidateArtifactRoot 'phase6c-ps1-extended-timing-candidate' `
            -Out 'phase6c-ps1-extended-timing-original' `
            -ObserveSamplerPs1ExtendedTiming

      - name: Validate original PS1 extended timing observation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/phase6c-sampler-ps1-extended-timing.py candidate-check `
            phase6c-ps1-extended-timing-candidate
          if ($LASTEXITCODE -ne 0) { throw "candidate timing validation failed" }
          python scripts/phase6c-sampler-ps1-extended-timing.py original-check `
            phase6c-ps1-extended-timing-candidate phase6c-ps1-extended-timing-original
          if ($LASTEXITCODE -ne 0) { throw "original timing validation failed" }

      - name: Upload original PS1 extended timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6c-sampler-ps1-extended-timing-original
          path: phase6c-ps1-extended-timing-original/
          if-no-files-found: warn

  compare-extended-timing:
    needs:
      - candidate-extended-timing
      - original-extended-timing
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download candidate timing evidence
        uses: actions/download-artifact@v4
        with:
          name: phase6c-sampler-ps1-extended-timing-candidate
          path: phase6c-ps1-extended-timing-candidate

      - name: Download original timing evidence
        uses: actions/download-artifact@v4
        with:
          name: phase6c-sampler-ps1-extended-timing-original
          path: phase6c-ps1-extended-timing-original

      - name: Compare pinned runtime observations
        shell: bash
        run: |
          set -euo pipefail
          mkdir phase6c-ps1-extended-timing-comparison
          python3 scripts/phase6c-sampler-ps1-extended-timing.py compare \
            phase6c-ps1-extended-timing-candidate \
            phase6c-ps1-extended-timing-original \
            phase6c-ps1-extended-timing-comparison/observation.json
          cat phase6c-ps1-extended-timing-comparison/observation.json

      - name: Upload PS1 extended timing comparison
        uses: actions/upload-artifact@v4
        with:
          name: phase6c-sampler-ps1-extended-timing-comparison
          path: phase6c-ps1-extended-timing-comparison/
