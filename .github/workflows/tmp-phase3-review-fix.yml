name: Temporary Phase 3 review fix

on:
  push:
    branches:
      - phase-3/first-native-linux-host

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3/first-native-linux-host
          fetch-depth: 0

      - name: Apply review fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          # Keep smoke-only diagnostics out of normal real-time audio callbacks.
          path = 'cpsycle/driver/sdl2/sdl2driver.c'
          replace_once(path,
              '#include <SDL2/SDL.h>  \n#include "../audiodriver.h"',
              '#include <SDL2/SDL.h>  \n#include <stdlib.h>\n#include "../audiodriver.h"')
          replace_once(path,
              '\tbool running_;\n\tbool callback_reported_;\n\tint (*error)(int, const char*);',
              '\tbool running_;\n\tbool callback_reported_;\n\tbool callback_marker_enabled_;\n\tint (*error)(int, const char*);')
          replace_once(path,
              '\tself->running_ = FALSE;\t\n\tpsy_audiodriversettings_init(&self->settings);',
              '\tself->running_ = FALSE;\t\n\tself->callback_marker_enabled_ =\n\t\t(getenv("PSYCLE_RUNTIME_SMOKE") != NULL);\n\tpsy_audiodriversettings_init(&self->settings);')
          replace_once(path,
              '\tif (!self->callback_reported_) {\n\t\tself->callback_reported_ = TRUE;\n\t\t/*\n\t\t** Runtime smoke marker: emit only after a complete callback invocation,\n\t\t** including host work and buffer conversion. stderr + explicit flush\n\t\t** makes the observation deterministic while the host remains running.\n\t\t*/\n\t\tfprintf(stderr, "psycle: sdl2 audio callback completed\\n");\n\t\tfflush(stderr);\n\t}',
              '\tif (self->callback_marker_enabled_ && !self->callback_reported_) {\n\t\tself->callback_reported_ = TRUE;\n\t\t/*\n\t\t** Test-only runtime smoke marker. Normal Psycle sessions never perform\n\t\t** stdio from the real-time callback; the smoke harness opts in through\n\t\t** PSYCLE_RUNTIME_SMOKE after requesting SDL\'s dummy backend.\n\t\t*/\n\t\tfprintf(stderr, "psycle: sdl2 audio callback completed\\n");\n\t\tfflush(stderr);\n\t}')

          # Preserve historical Windows VST2 behavior while keeping the Linux
          # public baseline opt-in and free of redistributed SDK headers.
          path = 'cpsycle/detail/psyconf.h'
          replace_once(path,
              '/*\n** VST2 is opt-in. The public PSYCLE-LINUX baseline intentionally omits the\n** legacy Steinberg SDK-derived headers; builds may define PSYCLE_ENABLE_VST2\n** only when a locally supplied, legally usable VST2 SDK boundary is present.\n*/\n#if defined(PSYCLE_ENABLE_VST2)\n#define PSYCLE_USE_VST2\n#endif',
              '/*\n** VST2 remains a supported feature. Microsoft builds retain Psycle\'s\n** historical VST2 behavior. Unix/Linux builds are opt-in because the public\n** PSYCLE-LINUX baseline intentionally omits the legacy Steinberg SDK-derived\n** headers; define PSYCLE_ENABLE_VST2 only with a compatible local SDK boundary.\n*/\n#if defined(DIVERSALIS__OS__MICROSOFT) || defined(PSYCLE_ENABLE_VST2)\n#define PSYCLE_USE_VST2\n#endif')

          # Remove stale PASS summaries and explicitly enable the callback marker
          # only for this isolated runtime smoke process.
          path = 'scripts/phase3-runtime-smoke.sh'
          replace_once(path,
              'LOG="$OUT/psycle.log"\nSUMMARY="$OUT/summary.md"\nSTATE="$OUT/state"\n',
              'LOG="$OUT/psycle.log"\nSUMMARY="$OUT/summary.md"\nSTATE="$OUT/state"\n\n# A failed rerun must never leave a PASS summary from an earlier invocation.\nrm -f "$SUMMARY"\n')
          replace_once(path,
              'export PSYCLE_AUDIO_DRIVER=sdl2\nexport SDL_AUDIODRIVER=dummy\n',
              'export PSYCLE_AUDIO_DRIVER=sdl2\nexport SDL_AUDIODRIVER=dummy\nexport PSYCLE_RUNTIME_SMOKE=1\n')

          # Document VST2 as an intentional Linux feature rather than an omitted
          # capability. The SDK/header material remains user-supplied.
          path = 'BUILDING.md'
          marker = '## Build layers\n'
          section = '''## Optional VST2 hosting on Linux\n\nVST2 hosting remains a supported Psycle feature. It is **disabled by default** in the public Linux baseline only because Phase 1 intentionally omitted the legacy Steinberg SDK-derived headers from redistribution.\n\nIf you have a compatible local VST2 SDK/header boundary that you are entitled to use, enable the existing VST2 host with:\n\n```bash\ncd cpsycle\nmake clean\nmake ENABLE_VST2=1 CPPFLAGS="-I/path/to/local/vst2/headers"\n```\n\nThe supplied include directory must make the VST2 headers expected by the imported Psycle sources available locally. `ENABLE_VST2=1` propagates `PSYCLE_ENABLE_VST2`, which restores the VST2 machine factory, scanner and host sources on Linux. The SDK itself remains outside this repository.\n\nWindows retains the historical Psycle VST2 feature gate; PSYCLE-LINUX does not treat Windows as a release target, but Linux-port changes should not silently disable an existing upstream capability.\n\n'''
          p = Path(path)
          text = p.read_text()
          if '## Optional VST2 hosting on Linux' not in text:
              if marker not in text:
                  raise SystemExit('BUILDING.md: build layers marker missing')
              p.write_text(text.replace(marker, section + marker, 1))
          PY

      - name: Commit clean result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-phase3-review-fix.yml
          git add cpsycle/driver/sdl2/sdl2driver.c cpsycle/detail/psyconf.h scripts/phase3-runtime-smoke.sh BUILDING.md
          git diff --cached --check
          git commit -m 'fix: preserve VST2 and harden runtime smoke'
          git push origin HEAD:phase-3/first-native-linux-host
